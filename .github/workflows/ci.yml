# CI: runs the Python tests and the full pipeline (ingestion -> dbt build ->
# analyses) against the committed extracts on every push and pull request.
# A failing dbt data test fails the workflow, which blocks the change.
name: ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt

      - name: Install pinned dependencies
        run: pip install -r source/requirements.txt

      - name: Validate Python syntax
        run: python -m compileall source/pipeline scripts

      - name: Run Python tests (incl. idempotency integration tests)
        working-directory: source
        run: python -m pytest tests -q

      - name: Run the full pipeline (ingest, dbt build + tests, analyses, docs)
        working-directory: source
        run: python -m pipeline.main all

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-evidence
          path: |
            logs/
            report/evidence/
          if-no-files-found: ignore
